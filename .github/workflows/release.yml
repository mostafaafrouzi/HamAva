name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag without v (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Signed Release APK & Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Extract Tag Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building HamAva release version: ${VERSION}"

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not configured in repository."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > hamava-release.jks
          cat <<EOF > keystore.properties
          storeFile=hamava-release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testBazaarDebugUnitTest

      - name: Build Release APK & AAB for Bazaar and Myket
        run: ./gradlew assembleBazaarRelease assembleMyketRelease bundleBazaarRelease bundleMyketRelease --stacktrace

      - name: Locate and Rename Artifacts
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          mkdir -p release-artifacts
          
          # Copy Bazaar artifacts
          cp app/build/outputs/apk/bazaar/release/app-bazaar-release.apk "release-artifacts/hamava-bazaar-v${VERSION}.apk"
          cp app/build/outputs/bundle/bazaarRelease/app-bazaar-release.aab "release-artifacts/hamava-bazaar-v${VERSION}.aab"
          
          # Copy Myket artifacts
          cp app/build/outputs/apk/myket/release/app-myket-release.apk "release-artifacts/hamava-myket-v${VERSION}.apk"
          cp app/build/outputs/bundle/myketRelease/app-myket-release.aab "release-artifacts/hamava-myket-v${VERSION}.aab"

      - name: Verify Signed Artifacts
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "release-artifacts/hamava-bazaar-v${VERSION}.apk"
          "$APKSIGNER" verify --verbose "release-artifacts/hamava-myket-v${VERSION}.apk"
          jarsigner -verify -verbose -certs "release-artifacts/hamava-bazaar-v${VERSION}.aab"
          jarsigner -verify -verbose -certs "release-artifacts/hamava-myket-v${VERSION}.aab"

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.get_version.outputs.VERSION }}"
          name: "HamAva v${{ steps.get_version.outputs.VERSION }}"
          body_path: .github/release-notes.md
          draft: false
          prerelease: false
          files: |
            release-artifacts/hamava-bazaar-v${{ steps.get_version.outputs.VERSION }}.apk
            release-artifacts/hamava-bazaar-v${{ steps.get_version.outputs.VERSION }}.aab
            release-artifacts/hamava-myket-v${{ steps.get_version.outputs.VERSION }}.apk
            release-artifacts/hamava-myket-v${{ steps.get_version.outputs.VERSION }}.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
