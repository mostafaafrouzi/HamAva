name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Signed Release APK & Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Tag Version
        id: get_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building HamAva release version: ${VERSION}"

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not configured in repository."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > hamava-release.jks
          cat <<EOF > keystore.properties
          storeFile=hamava-release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Release APK & AAB
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Locate and Rename Artifacts
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          mkdir -p release-artifacts
          
          # Find APK and copy
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" "release-artifacts/hamava-v${VERSION}.apk"
            echo "Renamed APK to release-artifacts/hamava-v${VERSION}.apk"
          else
            echo "::error::Release APK not found!"
            exit 1
          fi

          # Find AAB and copy
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -f "$AAB_PATH" ]; then
            cp "$AAB_PATH" "release-artifacts/hamava-v${VERSION}.aab"
            echo "Renamed AAB to release-artifacts/hamava-v${VERSION}.aab"
          else
            echo "::error::Release AAB not found!"
            exit 1
          fi

      - name: Verify Signed Artifacts
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          APK="release-artifacts/hamava-v${VERSION}.apk"
          
          echo "Verifying APK with apksigner..."
          ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --verbose "$APK"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "HamAva v${{ steps.get_version.outputs.VERSION }}"
          body_path: .github/release-notes.md
          draft: false
          prerelease: false
          files: |
            release-artifacts/hamava-v${{ steps.get_version.outputs.VERSION }}.apk
            release-artifacts/hamava-v${{ steps.get_version.outputs.VERSION }}.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
